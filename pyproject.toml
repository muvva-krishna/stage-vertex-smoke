[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "debev"
version = "0.1.0"
description = "Debugging-evidence evaluation pilot harness"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
debev = "debev.cli:main"
